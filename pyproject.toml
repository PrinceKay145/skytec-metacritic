[project]
name = "skytec-metacritic"
version = "0.1.0"
description = "Hourly Metacritic games crawler with LLM review summaries and a web UI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.11.3,<4",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
