services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metacritic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metacritic}
      POSTGRES_DB: metacritic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metacritic"]
      interval: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://metacritic:${POSTGRES_PASSWORD:-metacritic}@db:5432/metacritic
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
