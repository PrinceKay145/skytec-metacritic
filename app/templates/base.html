<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Metacritic games{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"
          integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
          crossorigin="anonymous"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f6f7; --surface: #fff; --text: #18181b; --muted: #6b6b76; --border: #e2e2e6;
      --accent: #2557d6; --good: #1d8a43; --mixed: #e0b012; --bad: #d23b2f; --none: #a1a1aa;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111114; --surface: #1b1b20; --text: #ececf1; --muted: #9d9daa; --border: #2d2d35; --accent: #8aa9ff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    a { color: var(--accent); }
    header.site { border-bottom: 1px solid var(--border); background: var(--surface); }
    header.site a { display: block; max-width: 1120px; margin: 0 auto; padding: .8rem 1rem; font-weight: 700; color: var(--text); text-decoration: none; }
    main { max-width: 1120px; margin: 0 auto; padding: 1rem; }
    h1 { margin: 0 0 .25rem; line-height: 1.2; }
    .muted { color: var(--muted); }
    .small { font-size: .8rem; }
    input, select, button { font: inherit; padding: .45rem .6rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); }
    button, .button { cursor: pointer; }
    .button { display: inline-block; padding: .45rem 1rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); text-decoration: none; }

    .filters { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; margin-bottom: .5rem; }
    .filters label { display: flex; flex-direction: column; gap: .2rem; font-size: .8rem; color: var(--muted); }
    .filters label:first-child { flex: 1 1 240px; }
    .count { margin: .5rem 0 1rem; color: var(--muted); }
    form.htmx-request + #results { opacity: .6; }

    .grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
    .card a { display: flex; flex-direction: column; height: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; color: inherit; text-decoration: none; }
    .card a:hover, .card a:focus-visible { border-color: var(--accent); }
    .cover { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; background: var(--border); }
    .card-body { display: flex; flex-direction: column; gap: .35rem; padding: .6rem .7rem .8rem; }
    .card h2 { margin: 0; font-size: .95rem; line-height: 1.3; }
    .card p { margin: 0; font-size: .8rem; }
    .more { grid-column: 1 / -1; text-align: center; }

    .score { display: inline-grid; place-items: center; min-width: 2.1rem; height: 2.1rem; padding: 0 .3rem; border-radius: 6px; font-weight: 700; font-size: .9rem; color: #fff; }
    .score-user { border-radius: 999px; }
    .score-good { background: var(--good); }
    .score-mixed { background: var(--mixed); color: #1a1a1a; }
    .score-bad { background: var(--bad); }
    .score-none { background: var(--none); font-weight: 500; font-size: .75rem; }

    .game { display: grid; grid-template-columns: minmax(0, 260px) 1fr; gap: 1.5rem; align-items: start; }
    .game .cover { border-radius: 10px; aspect-ratio: auto; }
    @media (max-width: 640px) { .game { grid-template-columns: 1fr; } .game .cover { max-width: 260px; } }
    table { border-collapse: collapse; margin: 1rem 0; }
    th, td { text-align: left; padding: .35rem 1.2rem .35rem 0; border-bottom: 1px solid var(--border); }
    thead th { font-size: .8rem; color: var(--muted); font-weight: 500; }
    .description { white-space: pre-line; max-width: 75ch; }
    .summaries { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
    .summary { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: .25rem 1.1rem 1rem; }
    .summary h4 { margin: .8rem 0 .2rem; }
    .summary ul { margin: 0; padding-left: 1.2rem; }
  </style>
</head>
<body>
  <header class="site"><a href="/">Metacritic games</a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
